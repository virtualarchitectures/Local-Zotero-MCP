[project]
name = "local-zotero-mcp"
version = "0.3.0"
description = "MCP server for the Zotero desktop app's Local API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2,<3",
    "httpx>=0.27",
    "pymupdf>=1.28.2",
]

[project.scripts]
zotero-mcp = "zotero_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zotero_mcp"]
